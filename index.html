<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Grupo Araújo Tratamentos: orientação familiar e encaminhamento responsável para clínicas parceiras de reabilitação.">
  <meta name="author" content="Grupo Araújo Tratamentos">
  <meta name="theme-color" content="#038291">

  <meta property="og:title" content="Grupo Araújo Tratamentos">
  <meta property="og:description" content="Orientação familiar e encaminhamento responsável para clínicas parceiras de reabilitação.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://www.grupoaraujotratamentos.com.br/">
  <meta property="og:image" content="https://www.grupoaraujotratamentos.com.br/og.png">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Grupo Araújo Tratamentos">
  <meta name="twitter:description" content="Orientação familiar e encaminhamento responsável para clínicas parceiras de reabilitação.">
  <meta name="twitter:image" content="https://www.grupoaraujotratamentos.com.br/og.png">

  <title>Grupo Araújo Tratamentos</title>

  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="preload" as="image" href="logotipo-horizontal-branco.png">
  <link rel="preload" as="image" href="logotipo-vertical-branco.png">
  <style>
    :root {
      --brand: #038291;
      --brand-dark: #016a75;
      --ink: #ffffff;
      --muted: rgba(255, 255, 255, 0.86);
      --line: rgba(255, 255, 255, 0.36);
      --shadow: 0 20px 48px rgba(0, 28, 33, 0.28);
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--ink);
      background: #032f36;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: flex;
      flex-direction: column;
    }

    body::before {
      position: fixed;
      inset: 0;
      z-index: -2;
      background:
        linear-gradient(90deg, rgba(0, 39, 45, 0.94), rgba(0, 71, 79, 0.74) 48%, rgba(2, 31, 36, 0.64)),
        url("site/assets/img/backgrounds/chacara-piscina-03.webp") center / cover no-repeat;
      content: "";
    }

    .landing {
      flex: 1;
      display: grid;
      padding: clamp(20px, 3.2vw, 42px);
      place-items: center;
    }

    .hero {
      display: grid;
      width: min(100%, 1120px);
      gap: clamp(8px, 1.4vw, 18px);
      align-items: center;
    }

    .logo {
      display: block;
      width: min(700px, 82vw);
      height: auto;
      margin-bottom: clamp(6px, 1.6vh, 14px);
      filter: drop-shadow(0 14px 30px rgba(0, 0, 0, 0.3));
    }

    .logo-mobile {
      display: none;
    }

    .content {
      max-width: 740px;
    }

    .eyebrow {
      margin: 0 0 8px;
      color: var(--muted);
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 0;
      text-transform: uppercase;
    }

    h1 {
      max-width: 720px;
      margin: 0;
      font-size: clamp(2.5rem, 5.4vw, 5.1rem);
      line-height: 0.98;
      letter-spacing: 0;
    }

    .lead {
      max-width: 620px;
      margin: 14px 0 0;
      color: var(--muted);
      font-size: clamp(1rem, 1.6vw, 1.2rem);
      line-height: 1.55;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      margin-top: 20px;
    }

    .button {
      display: inline-flex;
      min-height: 52px;
      align-items: center;
      justify-content: center;
      border: 1px solid transparent;
      border-radius: 8px;
      padding: 15px 22px;
      box-shadow: var(--shadow);
      color: #ffffff;
      font-size: 1rem;
      font-weight: 700;
      line-height: 1;
      text-decoration: none;
      transition: transform 180ms ease, background-color 180ms ease, border-color 180ms ease;
    }

    .button:hover {
      transform: translateY(-2px);
    }

    .button-primary {
      background: var(--brand);
    }

    .button-primary:hover {
      background: var(--brand-dark);
    }

    .button-secondary {
      border-color: var(--line);
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(12px);
    }

    .button-secondary:hover {
      border-color: rgba(255, 255, 255, 0.56);
      background: rgba(255, 255, 255, 0.22);
    }

    .landing-footer {
      padding: 0 clamp(20px, 3.2vw, 42px) 18px;
      color: rgba(255, 255, 255, 0.72);
      font-size: 0.86rem;
      text-align: center;
    }

    .landing-footer a {
      color: rgba(255, 255, 255, 0.82);
      font-weight: 700;
      text-decoration: none;
    }

    .landing-footer a:hover,
    .landing-footer a:focus-visible {
      color: #ffffff;
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    @media (min-width: 900px) and (max-height: 760px) {
      .landing {
        padding-block: 18px;
      }

      .logo {
        width: min(620px, 64vw);
        margin-bottom: 8px;
      }

      h1 {
        font-size: clamp(2.45rem, 4.8vw, 4.35rem);
      }

      .lead {
        margin-top: 12px;
      }

      .actions {
        margin-top: 18px;
      }
    }

    @media (max-width: 700px) {
      .landing {
        align-items: start;
        padding: 16px 20px 24px;
      }

      .hero {
        min-height: calc(100svh - 40px);
        display: flex;
        flex-direction: column;
        gap: 0;
        justify-content: flex-start;
        padding-top: clamp(8px, 4svh, 28px);
      }

      .logo-desktop {
        display: none;
      }

      .logo-mobile {
        display: block;
        width: min(205px, 58vw);
        margin-inline: auto;
        margin-bottom: 20px;
      }

      .content {
        text-align: center;
      }

      .lead {
        margin-inline: auto;
        margin-top: 12px;
        font-size: 0.98rem;
        line-height: 1.45;
      }

      .actions {
        flex-direction: column;
        gap: 10px;
        margin-top: 20px;
      }

      .button {
        width: 100%;
        min-height: 48px;
        padding: 14px 18px;
      }

      .landing-footer {
        padding: 0 20px 16px;
      }
    }
  </style>
</head>
<body>
  <main class="landing">
    <section class="hero" aria-label="Grupo Araújo Tratamentos">
      <img class="logo logo-desktop" src="logotipo-horizontal-branco.png" alt="Grupo Araújo Tratamentos">
      <img class="logo logo-mobile" src="logotipo-vertical-branco.png" alt="Grupo Araújo Tratamentos">

      <div class="content">
        <p class="eyebrow">Orientação familiar e encaminhamento responsável</p>
        <p class="lead">Acolhimento no primeiro contato e direcionamento para unidades parceiras.</p>
        <div class="actions" aria-label="Ações principais">
          <a class="button button-primary" href="site/">Visitar o Site</a>
          <a class="button button-primary" href="site/#unidades">Ver unidades</a>
          <a class="button button-secondary" href="https://wa.me/5562993897714?text=Ol%C3%A1%2C%20Atendente.%20Vim%20pelo%20site%20do%20Grupo%20Ara%C3%BAjo%20Tratamentos%20e%20gostaria%20de%20mais%20informa%C3%A7%C3%B5es." target="_blank" rel="noopener">Conversar no WhatsApp</a>
        </div>
      </div>
    </section>
  </main>
  <footer class="landing-footer">
    <a href="politica-de-privacidade.html">Política de Privacidade</a>
  </footer>
</body>
</html>
